<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-minjee-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Minjee Woo writes about reliable systems, system design, architecture, and clear engineering explanations."
    />
    <title>Minjee Woo · Software Engineering Essays</title>
    <script>
      // Apply the saved theme before React mounts.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored ? JSON.parse(stored).state?.theme : 'light'
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (_) {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
